[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
addopts = "-p no:respx --cov=custom_components.pet_feeder_local --cov-report=term-missing --cov-report=json:coverage.json"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components/pet_feeder_local"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
